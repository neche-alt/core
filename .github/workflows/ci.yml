name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund

      - name: Typecheck
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund

      - name: Lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund

      - name: Tests
        run: npm run test
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run size:check --if-present

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund

      # Blocking check: fail CI on high or critical vulnerabilities.
      # Severity policy: critical and high severities are blocking; moderate
      # and low are reported separately via the advisory step below.
      - name: Audit – fail on high/critical (blocking)
        run: npm audit --audit-level=high

      # Non-blocking advisory report: surface moderate and low findings for
      # visibility without breaking the build. The JSON output is printed to
      # the step log and uploaded as an artifact so it is visible in every PR.
      - name: Audit – advisory report for moderate/low (non-blocking)
        run: npm audit --json > audit-advisory-report.json 2>&1 || true

      - name: Upload advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-advisory-report
          path: audit-advisory-report.json
          retention-days: 30
